# CardioAuth local development stack.
#
# One public surface: the Caddy proxy published on ${CARDIOAUTH_HTTP_PORT:-3000}.
# Everything else is on the internal network only (db, minio, api, worker, web).
#
# No secrets live in this file. Every credential is interpolated from the shell
# environment with a development-only default, so a clean clone runs with no .env at
# all; production overrides them from a secret store (see docs/DEV.md).
#
# NOTE FOR THE READER: this stack has NOT been started on the build machine — that
# machine has a Docker client but no daemon. Correctness here rests on
# `docker compose config` validation and review, not on a running stack. See
# docs/DEV.md for the checklist to run once you have a working Docker daemon.
name: cardioauth

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardioauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardioauth_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cardioauth}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardioauth} -d ${POSTGRES_DB:-cardioauth}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cardioauth_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cardioauth_dev_only_change_me}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cardioauth-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cardioauth:cardioauth_dev_only@db:5432/cardioauth}
      CARDIOAUTH_ENV: ${CARDIOAUTH_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cardioauth-api:local
    restart: unless-stopped
    command:
      - uvicorn
      - cardioauth.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      CARDIOAUTH_ENV: ${CARDIOAUTH_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cardioauth:cardioauth_dev_only@db:5432/cardioauth}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CARDIOAUTH_PHI_LOGGING: ${CARDIOAUTH_PHI_LOGGING:-off}
      BLOB_BACKEND: ${BLOB_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-cardioauth-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cardioauth_dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cardioauth_dev_only_change_me}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      JOBS_INLINE: ${JOBS_INLINE:-false}
      PUBLIC_ORIGIN: ${CARDIOAUTH_PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cardioauth-api:local
    restart: unless-stopped
    command: ["python", "-m", "cardioauth.workers.worker"]
    environment:
      CARDIOAUTH_ENV: ${CARDIOAUTH_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cardioauth:cardioauth_dev_only@db:5432/cardioauth}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CARDIOAUTH_PHI_LOGGING: ${CARDIOAUTH_PHI_LOGGING:-off}
      BLOB_BACKEND: ${BLOB_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-cardioauth-dev}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cardioauth_dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cardioauth_dev_only_change_me}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2.0}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    image: cardioauth-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      INTERNAL_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${CARDIOAUTH_HTTP_PORT:-3000}:3000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [internal]

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
